name = "fc-intelligence"
main = "src/worker.ts"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]
[build]
command = "npm run build"
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
[[d1_databases]]
binding = "DB"
database_name = "fc-intelligence"
database_id = "f15b4e39-b337-43d1-92ee-a739307b6287"
migrations_dir = "migrations"
